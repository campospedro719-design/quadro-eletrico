<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro Elétrico — tela da sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: cena cartoon única (quadro de medidores à esquerda → cabo → casa e família à direita), placar e controles abaixo; questão abre num cartão sobreposto. Visual único e chapado, deliberadamente single-theme. */
:root{
  --sky:#8fd3e6; --ground:#8fcf5f; --ink:#22283a; --paper:#fffaf0;
  --panel:#5f6f86; --panel-dark:#46546a;
  --red:#f0595b; --green:#3fbf7f; --yellow:#ffd23f; --orange:#ff9f43; --blue:#4a7bd8;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:14px;margin:0}
.wrap{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,4vw,2.6rem);margin:0;line-height:1;color:var(--ink)}
header p{margin:4px 0 0;font-weight:700}
.chip{font-family:var(--display);background:var(--ink);color:var(--yellow);padding:4px 12px;border-radius:999px;font-size:.85rem}
.scene{background:var(--sky);border-radius:22px;overflow:hidden;border:4px solid var(--ink)}
svg.world{display:block;width:100%;height:auto;max-height:calc(100vh - 190px)}
svg text{font-family:var(--display)}
/* disjuntores dos circuitos */
.brk{cursor:pointer}
.brk:focus{outline:none}
.brk:focus-visible .bbody{stroke:var(--yellow);stroke-width:5}
.brk .bbody{fill:#eef1f5;stroke:var(--ink);stroke-width:3.5}
.brk.broken:hover .bbody{fill:#fff}
.brk .lev{transform-box:view-box;transition:transform .5s cubic-bezier(.3,1.6,.5,1),fill .3s}
.brk.broken .lev{fill:var(--red);transform:translateY(16px)}
.brk.fixed .lev{fill:var(--green)}
.brk .bled{fill:var(--red)}
.brk.broken .bled{animation:blink .6s steps(2) infinite}
.brk.fixed .bled{fill:var(--green)}
.brk .spark,.brk .smoke{display:none}
.brk.broken .spark{display:inline;animation:flick .35s steps(2) infinite}
.brk.broken .smoke{display:inline;animation:smoke 2.2s ease-out infinite}
.brk.broken .smoke:nth-of-type(2){animation-delay:1.1s}
.brk .tagc{fill:var(--yellow)}
.brk.fixed .tagc{fill:var(--green)}
@keyframes smoke{0%{opacity:.7;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-34px) scale(1.4)}}
.smoke{transform-box:fill-box;transform-origin:50% 50%}
@keyframes flick{0%{opacity:1}100%{opacity:0}}
@keyframes blink{0%{opacity:1}100%{opacity:.25}}
.lcd{fill:#7dffb0;font-variant-numeric:tabular-nums}
.lcd.err{fill:#ff6b6b;animation:blink .8s steps(2) infinite}
/* chave geral */
#mainSwitch .handle{transform-box:view-box;transition:transform .5s}
#mainSwitch.ready .handle{animation:nudge 1s ease-in-out infinite}
#mainSwitch.on .handle{transform:translateY(-34px);animation:none}
@keyframes nudge{50%{transform:translateY(-6px)}}
/* rede, ramal e entrada da casa */
.cable{stroke:#111;stroke-width:5;fill:none}
.flow{stroke:var(--yellow);stroke-width:4;fill:none;stroke-dasharray:14 16;opacity:0}
.s2 #flowHouse{opacity:1;animation:flow .6s linear infinite}
.flow.live{display:none}
@keyframes flow{to{stroke-dashoffset:-30}}
.kled{fill:var(--green)}
.powered .kled{animation:blink .5s steps(2) infinite}
.zoom{transition:stroke .4s}
.s2 .zoom{stroke:var(--yellow)}
/* casa */
.win{fill:#3a4257;transition:fill .6s}
.powered .win{fill:var(--yellow)}
.powered .glow{opacity:.55}
.glow{opacity:0;transition:opacity .8s}
/* personagens */
.char{transform-box:fill-box;transform-origin:50% 100%}
.char .arms-up,.char .happy,.char .brow-happy,.char .hair{display:none}
.cheerful .happy,.cheerful .brow-happy{display:inline}
.cheerful .sad,.cheerful .brow-sad{display:none}
.powered .family .arms-up,.powered .family .happy,.powered .family .brow-happy{display:inline}
.powered .family .arms-down,.powered .family .sad,.powered .family .brow-sad{display:none}
.powered .family .char{animation:jump .7s ease-in-out infinite}
.family .char{animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-2deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px) scaleY(1.04)}}
.char.zap .hair,.char.zap .arms-up,.char.zap .sad,.char.zap .brow-sad{display:inline}
.char.zap .arms-down,.char.zap .happy,.char.zap .brow-happy{display:none}
.char.zap{animation:shake .08s linear 14}
.char.zap .shirt,.char.zap .overall{fill:var(--yellow)}
.char.fixing{animation:hop .4s ease-in-out 3}
@keyframes shake{0%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}100%{transform:translate(-4px,2px)}}
@keyframes hop{50%{transform:translateY(-14px)}}
.bubble{opacity:0;transition:opacity .3s}
.bubble.show{opacity:1}
#famBubble .say-happy{display:none}
.powered #famBubble .say-happy{display:inline}
.powered #famBubble .say-sad{display:none}
/* barra inferior */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.teams{display:flex;flex-wrap:wrap;gap:8px}
.team{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 6px 4px 14px;display:flex;align-items:center;gap:10px;font-weight:800}
.team b{font-family:var(--display);background:var(--ink);color:var(--yellow);border-radius:999px;min-width:2.2em;text-align:center;padding:2px 8px;font-variant-numeric:tabular-nums}
.progress{font-family:var(--display);font-size:1.05rem}
button.b{appearance:none;font:700 .95rem var(--body);border-radius:999px;padding:9px 16px;cursor:pointer;border:3px solid var(--ink);background:var(--paper);color:var(--ink)}
button.b:hover{transform:translateY(-1px)}
button.b.go{background:var(--green);color:#fff}
button.b.bad{background:var(--red);color:#fff}
button.b.hl{background:var(--yellow)}
button.b:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hint{font-weight:700;margin:0}
/* cartão da questão */
.stage{position:fixed;inset:0;background:rgba(34,40,58,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.q{background:var(--paper);border:4px solid var(--ink);border-radius:22px;max-width:880px;width:100%;max-height:100%;overflow:auto;padding:20px 22px;box-shadow:0 10px 0 var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tag{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--panel-dark)}
.q h2{font-family:var(--display);font-size:1.7rem;margin:2px 0 0}
.timer{font-family:var(--display);font-size:2rem;background:var(--ink);color:var(--yellow);border-radius:999px;min-width:3.2ch;text-align:center;padding:2px 12px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--red);color:#fff}
.qtext{font-size:1.12rem;line-height:1.5;margin:10px 0 12px;font-weight:700}
.alts{display:grid;gap:8px}
.alt{position:relative;overflow:hidden;display:flex;gap:10px;align-items:flex-start;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:9px 12px;line-height:1.4}
.alt>*{position:relative}
/* barra de votos: cresce por tras do texto ate a % de quem escolheu a opcao */
.alt .barra{position:absolute;left:0;top:0;bottom:0;width:0;background:#cfd8e6;transition:width 1.1s cubic-bezier(.2,.8,.3,1)}
.alt .txt{flex:1}
.alt .pct{flex:none;align-self:center;font-family:var(--display);font-size:1.6rem;min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.alt .k{font-family:var(--display);font-size:1.25rem;width:1.8em;height:1.8em;flex:none;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
/* a certa fica em verde forte; as outras so mostram a barra */
.alt.correct{background:#2fb36b;border-color:#0f6b3a;color:#fff;box-shadow:0 0 0 3px #0f6b3a}
.alt.correct .barra{background:#17834a}
.alt.correct .k{background:#fff;color:#17834a}
.alt.correct .why{color:#eafff1}
.alt .why{display:block;font-size:.88rem;margin-top:3px;color:var(--panel-dark)}
.box{margin-top:12px;padding:10px 14px;border:3px dashed var(--ink);border-radius:14px;line-height:1.5;background:#fff}
.box h3{margin:0 0 4px;font-family:var(--display);font-size:1.05rem}
.award{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-weight:800}
.award label{display:flex;gap:6px;align-items:center;background:#fff;border:2px solid var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
svg.graf text{font-family:var(--body);font-size:11px;fill:var(--ink)}
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;pointer-events:none;font-family:var(--display);font-size:clamp(2.4rem,8vw,5.5rem);color:#fff;-webkit-text-stroke:3px var(--ink);text-align:center;animation:pop 1.6s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}20%{opacity:1;transform:scale(1.05) rotate(2deg)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:8;pointer-events:none;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- modo ao vivo: painel da sala, placar e contagem ---------- */
.sala{display:flex;align-items:center;gap:14px;background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:10px 14px}
.sala img{width:124px;height:124px;display:block;background:#fff;border-radius:6px}
.sala .lbl{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--panel-dark);margin:0}
.sala .cod{font-family:var(--display);font-size:2.4rem;line-height:1.1;letter-spacing:.14em;background:var(--ink);color:var(--yellow);border-radius:12px;padding:2px 14px;display:inline-block;margin:4px 0}
.sala .n{font-family:var(--display);font-size:1.05rem;margin:2px 0 0}
.banner{background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:9px 14px;font-weight:800;margin:0;line-height:1.4}
.banner.ruim{background:var(--red);color:#fff}
.team.lider{background:var(--yellow)}
.contagem{font-family:var(--display);font-size:1.1rem;background:var(--blue);color:#fff;border-radius:999px;padding:4px 14px;white-space:nowrap}
.contagem.cheio{background:var(--green)}
.quem{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-weight:800;font-size:.95rem}
.quem span{border:2px solid var(--ink);border-radius:999px;padding:3px 11px;background:#fff}
.quem span.ok{background:#dff5e8;border-color:var(--green)}
.quem span.nok{background:#ffe3e3;border-color:var(--red);opacity:.8}
.qhead .dir{display:flex;gap:10px;align-items:center}
.votos{margin:10px 0 0;font-weight:800;color:var(--panel-dark)}
.seguindo{font-family:var(--display);font-size:1.2rem;background:var(--ink);color:var(--yellow);border-radius:999px;padding:6px 16px}
/* ---------- cena do circuito (10 s depois de cada questao) ---------- */
.cena-palco{position:fixed;inset:0;z-index:7;background:rgba(34,40,58,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.cena-quadro{width:100%;max-width:1500px;background:var(--paper);border:4px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 10px 0 var(--ink)}
.cena-topo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--ink);color:#fff}
.cena-topo .num{font-family:var(--display);background:var(--yellow);color:var(--ink);border-radius:999px;padding:2px 14px;font-size:1.1rem}
.cena-topo b{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.6rem);letter-spacing:.05em;animation:entra .8s cubic-bezier(.2,1.4,.4,1)}
.cena-topo small{font-weight:800;font-size:1.05rem;opacity:.8}
.cena-topo .res{margin-left:auto;font-family:var(--display);font-size:1.35rem;border-radius:999px;padding:4px 16px;opacity:0;transform:scale(.6);transition:opacity .4s,transform .4s cubic-bezier(.2,1.6,.4,1)}
.cena-topo .res.ok{background:var(--green)} .cena-topo .res.falha{background:var(--red)}
.cena-palco.res-on .res{opacity:1;transform:scale(1)}
@keyframes entra{0%{opacity:0;transform:translateX(-40px)}100%{opacity:1;transform:none}}
.cena-wrap svg{display:block;width:100%;height:auto;max-height:calc(100vh - 150px)}
.cena-tempo{height:10px;background:#d8d2c4}
.cena-tempo span{display:block;height:100%;width:0;background:var(--yellow)}
.cena-palco.roda .cena-tempo span{width:100%;transition:width 10s linear}
/* eletricista: entra pela esquerda, sobe na escada se precisar e trabalha */
.cena-palco .anda{transform:translateX(-140px);transition:transform 1.9s ease-in-out}
.cena-palco.chegou .anda{transform:translateX(var(--alvo))}
.cena-palco .sobe{transition:transform .8s ease-in-out}
.cena-palco.subiu .sobe{transform:translateY(var(--sobe))}
.cena-palco.andando #elecCena{animation:hop .45s ease-in-out infinite}
.cena-palco.trabalha #elecCena{animation:mexe .3s ease-in-out infinite}
.cena-palco.trabalha #elecCena .arms-up,.cena-palco.festa #elecCena .arms-up{display:inline}
.cena-palco.trabalha #elecCena .arms-down,.cena-palco.festa #elecCena .arms-down{display:none}
.cena-palco.festa #elecCena{animation:hop .5s ease-in-out infinite}
@keyframes mexe{50%{transform:translateY(-4px) rotate(2deg)}}
.cena-palco .fala{opacity:0;transition:opacity .3s}
.cena-palco.falou .fala{opacity:1}
/* estados do comodo: antes do conserto, deu certo (.ok) ou deu errado (.falha) */
.cena-palco .escuro{opacity:.45;transition:opacity 1.2s}
.cena-palco.ok .escuro{opacity:0}
.cena-palco .luz-on,.cena-palco .plugue,.cena-palco .vapor,.cena-palco .escudo,.cena-palco .espelho,.cena-palco .fluxo{opacity:0;transition:opacity .6s}
.cena-palco.ok .luz-on,.cena-palco.ok .plugue,.cena-palco.ok .escudo,.cena-palco.ok .fluxo,.cena-palco.obra .espelho{opacity:1}
.cena-palco .fios{transition:opacity .5s} .cena-palco.obra .fios{opacity:0}
.cena-palco .lampada{fill:#d7dde5;transition:fill .4s} .cena-palco.ok .lampada{fill:#ffd23f}
.cena-palco.falha .lampada{fill:#6b7280;animation:blink .15s steps(2) 6}
.cena-palco .faisca,.cena-palco .fumaca,.cena-palco .queimado,.cena-palco .trinca,.cena-palco .agua,.cena-palco .so-ok,.cena-palco .so-falha{display:none}
.cena-palco.falha .faisca{display:inline;animation:flick .2s steps(2) infinite}
.cena-palco.falha .fumaca{display:inline;animation:smoke 2s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.cena-palco.falha .queimado,.cena-palco.falha .trinca,.cena-palco.ok .agua,.cena-palco.falha .agua,.cena-palco.ok .so-ok,.cena-palco.falha .so-falha{display:inline}
.cena-palco.ok .so-antes,.cena-palco.falha .so-antes{display:none}
.cena-palco .corrente,.cena-palco.ok .fluxo{animation:flow .6s linear infinite}
.cena-palco.ok .tecla{fill:var(--green)}
.cena-palco .gota{animation:cai .7s linear infinite}
@keyframes cai{0%{transform:translateY(0);opacity:1}100%{transform:translateY(150px);opacity:0}}
.cena-palco.ok .vapor{opacity:1;animation:vapor 2.4s ease-out infinite}
@keyframes vapor{0%{transform:translateY(20px);opacity:0}40%{opacity:.9}100%{transform:translateY(-60px);opacity:0}}
.cena-palco .nivel{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.35);transition:transform 1.6s,fill 1.6s}
.cena-palco.ok .nivel{transform:scaleY(1.4);fill:var(--red)} .cena-palco.ok .bulbo{fill:var(--red)}
.cena-palco .alavanca{transform-box:fill-box;transition:transform .35s,fill .35s}
.cena-palco.ok .alavanca{transform:translateY(18px);fill:var(--red)}
.cena-palco .fuga{animation:flick .3s steps(2) infinite} .cena-palco.ok .fuga{display:none}
.cena-palco .janela{fill:#3a4257;transition:fill .8s} .cena-palco.ok .janela{fill:var(--yellow)}
.cena-palco.falha .cabo{stroke:var(--red);animation:blink .5s steps(2) infinite}
button.b.inicio{font-size:1.25rem;padding:12px 26px}
/* relatorio final, projetado para a turma inteira ler */
.relatorio{position:fixed;inset:0;background:rgba(34,40,58,.75);z-index:12;display:flex;align-items:center;justify-content:center;padding:18px}
.rel{background:var(--paper);border:4px solid var(--ink);border-radius:22px;max-width:1500px;width:100%;max-height:100%;overflow:auto;padding:20px 24px;box-shadow:0 10px 0 var(--ink)}
.rel h2{font-family:var(--display);font-size:2rem;margin:0}
.rel h3{font-family:var(--display);font-size:1.3rem;margin:18px 0 0}
.rel p.leg{margin:4px 0 0;font-weight:700;color:var(--panel-dark)}
.rel table{border-collapse:collapse;width:100%;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.rel th,.rel td{border:2px solid var(--ink);padding:7px 10px;text-align:center;font-weight:800;white-space:nowrap}
.rel thead th{background:var(--ink);color:var(--yellow);font-family:var(--display);font-size:1.05rem}
.rel tbody th{background:#fff;text-align:left;font-family:var(--display);font-size:1.05rem}
.rel td.c{background:#dff5e8;color:#1b7a49}
.rel td.e{background:#ffe3e3;color:#a32c2e}
.rel td.v{background:#efeee9;color:var(--panel-dark)}
.rel td.gab{background:var(--yellow)}
.rel td.pt{background:var(--ink);color:var(--yellow);font-family:var(--display);font-size:1.1rem}
.rel tr.gabarito th{background:var(--yellow)}
.rel .qitem{border-top:2px dashed #d8d2c4;padding:10px 0;line-height:1.5;white-space:normal}
.rel .qitem b.g{color:#1b7a49}
.rel .fechar{margin-top:16px}
.rel .meta{margin:12px 0 0;border:3px solid var(--ink);border-radius:16px;padding:10px 14px}
.rel .meta.ok{background:#fff6cf}
.rel .meta.nao{background:#e4e7ee}
.rel .meta-tit{font-family:var(--display);font-size:1.25rem}
.rel .meta-barra{position:relative;height:22px;margin-top:8px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.rel .meta-barra span{display:block;height:100%;background:var(--red)}
.rel .meta.ok .meta-barra span{background:var(--green)}
.rel .meta-barra i{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink)}
.rel tr.pct th{background:#efeee9}
/* contagem regressiva ocupando a tela da sala */
.contagem-grande{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none;background:rgba(34,40,58,.62)}
.contagem-grande span{font-family:var(--display);font-size:min(38vw,32vh);line-height:1;color:var(--yellow);-webkit-text-stroke:6px var(--ink)}
.contagem-grande.bate span{animation:bate .95s ease-out}
@keyframes bate{0%{transform:scale(.45);opacity:0}28%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@media (max-width:860px){
  .sala img{width:92px;height:92px}
  .sala .cod{font-size:1.8rem}
  svg.world{max-height:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div><h1>Quadro Elétrico</h1><p>Resolva os 5 circuitos do quadro e devolva a energia para a família.</p></div>
    <div class="sala" id="painelSala">
      <img src="qr.svg" alt="QR code que abre o jogo no celular" width="124" height="124">
      <div>
        <p class="lbl">Aponte a câmera do celular</p>
        <span class="cod" id="codigo">····</span>
        <p class="n" id="nJog">0 jogadores</p>
      </div>
    </div>
  </header>
  <p class="banner" id="banner" hidden></p>

  <div class="scene" id="scene">
    <svg class="world" viewBox="0 0 1200 510" role="img" aria-label="Casa sem energia ligada à rede, com o quadro de distribuição ampliado ao lado">
      <!-- chão e nuvens -->

/* Versao do combinado entre a sala e os celulares. Celular com outra

const VERSAO=4;
/* Recarregar a tela da sala (Ctrl+F5) mantem o codigo: senao quem ja
   entrou ficaria preso numa sala que ninguem mais controla. So vale para
   recarga recente (15 min sem a pagina aberta); na aula seguinte a sala
   e nova, sem os nomes de quem testou antes. */
const COD=(()=>{
  const k="quadro:salaProjetor", marca=c=>{ try{ localStorage.setItem(k,JSON.stringify({cod:c,em:Date.now()})) }catch(e){} };
  let c=null;
  try{ const v=JSON.parse(localStorage.getItem(k)||"null");
    if(v&&v.cod&&Date.now()-v.em<15*60*1000) c=v.cod; }catch(e){}
  c=c||Sala.novoCodigo(); marca(c); setInterval(()=>marca(c),60*1000);
  return c;
})();

/* meta da turma em % inteiro (45), vinda do config.js; conta so com inteiros
   para 45% de 11 alunos nao depender de arredondamento de ponto flutuante */
const META=(typeof window.META_TURMA==="number"&&window.META_TURMA>0&&window.META_TURMA<=1)
  ?Math.round(window.META_TURMA*100):45;
let turma=null;   /* resultado coletivo, calculado so no fim */
function calculaTurma(res,ids){
  const porQ={}; let certos=0;
  Q.forEach(q=>{
    const r=res[q.n]||{};
    const c=ids.filter(id=>r[id]&&r[id].alt===q.ok).length;
    porQ[q.n]=ids.length?Math.round(100*c/ids.length):0;
    certos+=c;
  });
  const total=ids.length*Q.length;
  return {certos,total,pct:total?Math.round(100*certos/total):0,meta:META,
    ligou:total===0||certos*100>=META*total,porQ};
}

function openQ(n){
  cur=Q.find(q=>q.n===n); const m=M[n-1];
  $("qtag").textContent=`Questão ${n} · ${cur.lvl}`; $("qtitle").textContent=`Circuito com defeito: ${m.name.toLowerCase()}`;
  $("qtext").textContent=cur.text; $("qfig").innerHTML=cur.fig?(FIGURAS[cur.fig]||""):"";
  $("alts").innerHTML=cur.alts.map((a,i)=>`<div class="alt" id="alt${i}"><span class="barra"></span><span class="k">${"ABCD"[i]}</span><span class="txt">${a[0]}<span class="why" hidden>${a[1]}</span></span><span class="pct" hidden></span></div>`).join("");
  $("glossBox").innerHTML=""; $("after").innerHTML="";
  /* ao vivo ninguem pula: a questao so fecha quando o tempo acaba ou quando
     todo mundo respondeu. Sem celulares, quem apresenta pode revelar antes. */
  $("actions").innerHTML=`<button class="b" id="bGl">Consultar glossário</button>`+(aoVivo?"":`<button class="b hl" id="bRev">Revelar resposta</button>`);
  $("bGl").onclick=()=>{$("glossBox").innerHTML=`<div class="box"><h3>Glossário · Etapa 1</h3>${cur.gl}</div>`};
  if(!aoVivo) $("bRev").onclick=reveal;
  $("stage").hidden=false; jaRevelou=false; revelarAgendado=false; desenhaPlacar(); startTimer(cur.t); publicaPergunta(cur,m);

function startTimer(s){clearInterval(tick);left=s;const t=$("timer");t.hidden=false;t.textContent=left;t.classList.remove("low");
  tick=setInterval(()=>{left--;t.textContent=Math.max(left,0);if(left<=10)t.classList.add("low");
    if(left<=0){clearInterval(tick); if(!jaRevelou&&!$("stage").hidden) reveal();}},1000)}
async function reveal(){
  if(jaRevelou)return;
  clearInterval(tick); jaRevelou=true; $("contagem").hidden=true; $("timer").hidden=true; desenhaPlacar();
  /* Le as respostas DIRETO do banco, em vez de usar a ultima copia
     sincronizada: ela pode estar ate 1,5 s atrasada, e quem respondeu nos
     ultimos segundos perderia o voto. */
  const q=cur;
  let res=respostas[q.n]||{};
  if(aoVivo){ try{ res=(await Sala.ler("salas/"+COD+"/respostas/"+q.n))||{} }catch(e){} }
  respostasQ[q.n]=res;
  /* % sobre a turma inteira: quem nao respondeu tambem conta no total */
  const ids=Object.keys(jogadores), total=ids.length, votos=[0,0,0,0];
  ids.forEach(id=>{const r=res[id]; if(r&&votos[r.alt]!==undefined) votos[r.alt]++});
  const pct=votos.map(v=>total?Math.round(100*v/total):0);
  const responderam=votos.reduce((x,y)=>x+y,0);
  q.alts.forEach((_,i)=>{
    const el=$("alt"+i); el.classList.add(i===q.ok?"correct":"wrong");
    el.querySelector(".why").hidden=false;
    if(total){ const p=el.querySelector(".pct"); p.hidden=false; p.textContent=pct[i]+"%";
      el.querySelector(".barra").style.width=pct[i]+"%"; }
  });
  $("after").innerHTML=(total?'<p class="votos">'+responderam+" de "+total+" responderam"+
      (total>responderam?" · "+(total-responderam)+" sem resposta (conta como erro)":"")+"</p>":"")+
    '<div class="box"><h3>Resolução · resposta '+"ABCD"[q.ok]+'</h3>'+q.sol+'</div>';
  /* 7 s com o resultado na tela e segue sozinho para a cena do circuito */
  let falta=7;
  $("actions").innerHTML='<span class="seguindo">Circuito '+q.n+' em <b id="seg">'+falta+'</b> s</span>';
  const cont=setInterval(()=>{ falta--; const e=$("seg"); if(e) e.textContent=Math.max(falta,0); if(falta<=0) clearInterval(cont); },1000);
  timers.push(setTimeout(()=>{ clearInterval(cont); finish(); },7000));
  if(aoVivo){
    enfileira(async()=>{
      await Sala.gravar("salas/"+COD+"/revelado",{n:q.n,ok:q.ok,pct:pct,total:total});
      await Sala.mesclar("salas/"+COD+"/info",{estado:"revelando"});
    },"O resultado");
  }
}

function person(o){
  const s=o.s, w=27*s, h=40*s, leg=16*s, cy=470-leg-h, lx=w*0.38, K="var(--ink)";
  const ex=w*0.34, ey=cy-h*0.36, er=7.5*s;
  const arm=(side,up)=>{const sx=side*w*0.9, sy=up?cy-h*0.25:cy-h*0.02;
    const ex2=up?sx+side*14*s:sx+side*7*s, ey2=up?sy-38*s:sy+32*s;
    return `<path d="M${sx} ${sy} Q ${sx+side*(up?18:12)*s} ${up?sy-10*s:sy+14*s} ${ex2} ${ey2}" stroke="${K}" stroke-width="${4.5*s}" fill="none" stroke-linecap="round"/><circle cx="${ex2}" cy="${ey2}" r="${5.5*s}" fill="${o.color}" stroke="${K}" stroke-width="${3*s}"/>`};
  const eye=x=>`<circle cx="${x}" cy="${ey}" r="${er}" fill="#fff" stroke="${K}" stroke-width="${2*s}"/><circle cx="${x+0.8*s}" cy="${ey+1.2*s}" r="${3.6*s}" fill="${K}"/><circle cx="${x-0.6*s}" cy="${ey-0.6*s}" r="${1.3*s}" fill="#fff"/>`;
  const by=ey-er-4*s;
  return `<g transform="translate(${o.x},0)"><g class="char ${o.cls||""}" ${o.id?`id="${o.id}"`:""} style="animation-delay:${o.delay||0}s">
    ${o.back?o.back(w,h,cy,s):""}
    <line x1="${-lx}" y1="${cy+h*0.8}" x2="${-lx}" y2="465" stroke="${K}" stroke-width="${5*s}" stroke-linecap="round"/>
    <line x1="${lx}" y1="${cy+h*0.8}" x2="${lx}" y2="465" stroke="${K}" stroke-width="${5*s}" stroke-linecap="round"/>
    <ellipse cx="${-lx-3*s}" cy="467" rx="${9*s}" ry="${4.5*s}" fill="${o.shoe||K}"/><ellipse cx="${lx+3*s}" cy="467" rx="${9*s}" ry="${4.5*s}" fill="${o.shoe||K}"/>
    <g class="arms-down">${arm(-1,false)}${arm(1,false)}</g><g class="arms-up">${arm(-1,true)}${arm(1,true)}</g>
    <ellipse class="${o.bodyCls||""}" cx="0" cy="${cy}" rx="${w}" ry="${h}" fill="${o.color}" stroke="${K}" stroke-width="${4*s}"/>
    ${o.front?o.front(w,h,cy,s):""}
    ${eye(-ex)}${eye(ex)}
    <g class="brow-sad" stroke="${K}" stroke-width="${3*s}" stroke-linecap="round"><line x1="${-ex-6*s}" y1="${by+2*s}" x2="${-ex+6*s}" y2="${by-3*s}"/><line x1="${ex+6*s}" y1="${by+2*s}" x2="${ex-6*s}" y2="${by-3*s}"/></g>
    <g class="brow-happy" stroke="${K}" stroke-width="${3*s}" stroke-linecap="round" fill="none"><path d="M${-ex-6*s} ${by} Q ${-ex} ${by-6*s} ${-ex+6*s} ${by}"/><path d="M${ex-6*s} ${by} Q ${ex} ${by-6*s} ${ex+6*s} ${by}"/></g>
    <circle cx="${-w*0.6}" cy="${cy-h*0.06}" r="${4.5*s}" fill="#ff8fa3" opacity=".7"/><circle cx="${w*0.6}" cy="${cy-h*0.06}" r="${4.5*s}" fill="#ff8fa3" opacity=".7"/>
    <path class="sad" d="M${-7*s} ${cy+h*0.14} Q 0 ${cy+h*0.14-7*s} ${7*s} ${cy+h*0.14}" stroke="${K}" stroke-width="${3*s}" fill="none" stroke-linecap="round"/>
    <path class="happy" d="M${-10*s} ${cy+h*0.03} Q 0 ${cy+h*0.03+18*s} ${10*s} ${cy+h*0.03} Z" fill="#8a2b3b" stroke="${K}" stroke-width="${2.5*s}" stroke-linejoin="round"/>
    ${o.top?o.top(w,h,cy,s):""}
  </g></g>`;
}

      <path d="M${-w*0.5} ${cy-h*0.9} Q ${-w*0.1} ${cy-h*1.25} ${w*0.15} ${cy-h*0.97} Q ${w*0.3} ${cy-h*1.2} ${w*0.55} ${cy-h*0.88}" fill="none" stroke="${K}" stroke-width="5" stroke-linecap="round"/>
      <g fill="none" stroke="${K}" stroke-width="2.5"><circle cx="${-w*0.34}" cy="${cy-h*0.36}" r="${10*s}"/><circle cx="${w*0.34}" cy="${cy-h*0.36}" r="${10*s}"/><line x1="${-w*0.34+10*s}" y1="${cy-h*0.36}" x2="${w*0.34-10*s}" y2="${cy-h*0.36}"/></g>`},

    front:(w,h,cy,s)=>`<circle cx="${-w*0.98}" cy="${cy-h*0.1}" r="${3.5*s}" fill="var(--yellow)" stroke="${K}" stroke-width="1.5"/><circle cx="${w*0.98}" cy="${cy-h*0.1}" r="${3.5*s}" fill="var(--yellow)" stroke="${K}" stroke-width="1.5"/>

    top:(w,h,cy,s)=>`<path d="M${-w*0.98} ${cy-h*0.35} Q ${-w*0.9} ${cy-h*1.12} 0 ${cy-h*1.0} Q ${w*0.9} ${cy-h*1.12} ${w*0.98} ${cy-h*0.35} Q ${w*0.55} ${cy-h*0.78} 0 ${cy-h*0.72} Q ${-w*0.55} ${cy-h*0.78} ${-w*0.98} ${cy-h*0.35} Z" fill="#6b3a1f" stroke="${K}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M${w*0.35} ${cy-h*0.95} l ${8*s} ${-8*s} l ${2*s} ${12*s} Z M${w*0.35} ${cy-h*0.95} l ${-10*s} ${-6*s} l ${2*s} ${12*s} Z" fill="#ff6fa0" stroke="${K}" stroke-width="2"/>`},

function render(){
  $("meters").innerHTML=M.map(meterSVG).join("");
  $("elecWrap").innerHTML=person(CHARS.elec);
  $("family").innerHTML=[CHARS.pai,CHARS.mae,CHARS.filho].map(person).join("");
  desenhaPlacar();
  const done=Object.keys(st.fixed).length;
  const lcd=$("lcd"); if(st.falhou){lcd.textContent="TURMA "+turma.pct+"%";lcd.classList.add("err")} else if(st.powered){lcd.textContent="220 V · OK";lcd.classList.remove("err")} else if(st.last){lcd.textContent=st.last;lcd.classList.remove("err")} else {lcd.textContent="FALHA";lcd.classList.add("err")}
  $("progress").textContent=`Circuitos consertados: ${done}/5`;
  $("hint").textContent=acabou?(st.falhou
      ?"A turma ficou abaixo da meta de "+META+"%: o disjuntor geral desarmou e a casa continua no escuro."
      :"Fim de jogo! O relatório da turma está na tela.")
    :comecou&&aoVivo?"Todos respondem a mesma questão no celular. Ela fecha quando o tempo acaba ou quando todos responderem. A casa só volta a ter luz se a turma acertar pelo menos "+META+"% no total."
    :!comecou?(aoVivo?"Espere a turma entrar pelo QR code e clique em Iniciar partida.":"Clique em Iniciar partida para começar.")
    :"As questões abrem sozinhas, uma depois da outra.";
  atualizaBotaoInicio();
}
function finish(){
  const q=cur, n=q.n, res=respostasQ[n]||{}, ids=Object.keys(jogadores);
  const certos=ids.filter(id=>res[id]&&res[id].alt===q.ok).length;
  /* maioria da turma; empate conta como acerto, quem nao respondeu conta como erro */
  const bem = ids.length===0 ? true : certos*2>=ids.length;
  const pct = ids.length ? Math.round(100*certos/ids.length) : null;
  closeQ();
  animaCircuito(n,bem,pct,()=>{
    if(bem){ st.fixed[n]=true; st.last=M[n-1].read;
      if(aoVivo)enfileira(()=>Sala.mesclar("salas/"+COD+"/consertados",{[n]:true}),"O conserto do circuito"); }
    render();
    if(n<Q.length) openQ(n+1); else encerrar();
  });
}

/* Cena de 10 s do circuito n, num comodo da casa (desenhos em cenas.js).
   bem = a maioria acertou: o eletricista conserta; senao leva o choque. */
function animaCircuito(n,bem,pct,depois){
  const c=CENAS[n], m=M[n-1], p=$("cenaPalco");
  if(aoVivo)enfileira(()=>Sala.mesclar("salas/"+COD+"/info",
    {estado:"circuito",circuito:n,circOk:bem,circPct:pct}),"A cena do circuito");
  $("cenaTopo").innerHTML='<span class="num">Circuito '+n+'</span><b>'+m.name+'</b><small>'+c.comodo+'</small>'+
    '<span class="res '+(bem?"ok":"falha")+'">'+(pct===null?"":"A turma acertou "+pct+"% ")+(bem?"✔":"✘")+'</span>';
  const topo=348-c.sobe, frase=bem?c.ok:c.falha;
  $("cenaWrap").innerHTML='<svg viewBox="0 0 1200 510" role="img" aria-label="Circuito '+n+', '+m.name+': '+frase+'">'+
    c.desenho()+'<rect class="escuro" width="1200" height="470" fill="#0d1530"/>'+
    '<g class="anda" style="--alvo:'+c.alvo+'px"><g class="sobe" style="--sobe:'+(-c.sobe)+'px">'+
      person(Object.assign({},CHARS.elec,{x:0,id:"elecCena"}))+'</g></g>'+c.fx+
    '<g class="fala" transform="translate('+(c.alvo-360)+','+(topo-96)+')">'+
      '<rect width="330" height="58" rx="16" fill="#fff" stroke="var(--ink)" stroke-width="4"/>'+
      '<path d="M300 56 L 340 86 L 270 56" fill="#fff" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>'+
      '<rect x="268" y="50" width="34" height="8" fill="#fff"/>'+
      '<text x="165" y="38" text-anchor="middle" font-size="24">'+frase+'</text></g></svg>';
  p.className="cena-palco"; p.hidden=false; void p.offsetWidth;
  const T=(ms,f)=>timers.push(setTimeout(f,ms));
  p.classList.add("roda");
  T(300,()=>p.classList.add("chegou","andando"));
  T(2200,()=>{ p.classList.remove("andando"); if(c.sobe) p.classList.add("subiu"); });
  T(c.sobe?3100:2500,()=>p.classList.add("trabalha","obra"));
  T(5300,()=>{
    p.classList.remove("trabalha"); p.classList.add(bem?"ok":"falha","res-on");
    if(bem) p.classList.add("festa"); else { const e=$("elecCena"); if(e) e.classList.add("zap"); }
  });
  T(6300,()=>p.classList.add("falou"));
  T(10000,()=>{ p.hidden=true; depois(); });
}
function powerOn(){
  if(st.powered) return; st.powered=true;
  const sc=$("scene"), sw=$("mainSwitch");
  sw.classList.add("ready"); say("Armando o disjuntor geral...",1600);
  const T=[[900,()=>{sw.classList.remove("ready");sw.classList.add("on");sc.classList.add("s1")}],
           [1700,()=>sc.classList.add("s2")],
           [2500,()=>sc.classList.add("s3")],
           [3000,()=>{sc.classList.add("powered");render();kwhTick=setInterval(()=>{st.kwh+=1;$("kwh").textContent=String(st.kwh).padStart(5,"0")},700);flash("Casa energizada!");say("Missão cumprida!",2600);confetti();if(aoVivo)enfileira(()=>Sala.mesclar("salas/"+COD+"/info",{estado:"fim"}),"O encerramento")}]];
  T.forEach(([t,f])=>timers.push(setTimeout(f,t)));
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#ffd23f","#f0595b","#3fbf7f","#4a7bd8","#c56cf0","#ff9f43"];
  for(let k=0;k<90;k++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=cols[k%cols.length];c.style.animationDuration=(2.2+Math.random()*2)+"s";c.style.animationDelay=(Math.random()*.8)+"s";$("fx").appendChild(c);setTimeout(()=>c.remove(),5200)}
}
let timers=[];
function closeQ(){clearInterval(tick);$("stage").hidden=true}

  timers.forEach(clearTimeout);clearInterval(kwhTick);$("kwh").textContent="04821";timers=[];st=fresh();
  ["s1","s2","s3","powered"].forEach(c=>$("scene").classList.remove(c));
  $("mainSwitch").className.baseVal="";$("electrician").classList.remove("zap","fixing");
  cur=null;jaRevelou=false;comecou=false;contando=false;revelarAgendado=false;acabou=false;

    for(const id of Object.keys(jogadores))
      await Sala.mesclar("salas/"+COD+"/jogadores/"+id,{pontos:0});

};
/* ---------- comeco da partida ---------- */
const espera=ms=>new Promise(r=>timers.push(setTimeout(r,ms)));
function mostraContagem(k){
  const el=$("contagemGrande");
  el.hidden=false; el.querySelector("span").textContent=k;
  el.classList.remove("bate"); void el.offsetWidth; el.classList.add("bate");
}
function escondeContagem(){ $("contagemGrande").hidden=true }
/* Enquanto nao se sabe se a sala abriu, o botao fica desligado: ligado cedo
   demais, alguem comeca a partida antes da turma conseguir entrar. */
function atualizaBotaoInicio(){
  const bi=$("iniciar"); if(!bi)return;
  bi.hidden=comecou;
  bi.disabled = contando || !salaPronta || (aoVivo && !Object.keys(jogadores).length);
  const be=$("encerrar"); if(be) be.hidden=!(aoVivo&&comecou&&!acabou);
  const bv=$("verRel"); if(bv) bv.hidden=!acabou;
}

async function iniciarPartida(){
  if(contando||comecou)return;
  contando=true; atualizaBotaoInicio();
  /* partida nova comeca do zero, mas sem derrubar quem ja entrou */
  timers.forEach(clearTimeout); clearInterval(kwhTick); $("kwh").textContent="04821"; timers=[];
  st=fresh(); ["s1","s2","s3","powered"].forEach(c=>$("scene").classList.remove(c));
  $("mainSwitch").className.baseVal=""; $("electrician").classList.remove("zap","fixing");
  cur=null; jaRevelou=false; acabou=false; respostasFinais={}; respostasQ={}; turma=null;
  closeQ(); $("cenaPalco").hidden=true; fecharRelatorio(); render();
  if(aoVivo){
    await enfileira(async()=>{
      await Sala.apagar("salas/"+COD+"/respostas");
      await Sala.apagar("salas/"+COD+"/gabarito");
      await Sala.apagar("salas/"+COD+"/consertados");
      await Sala.apagar("salas/"+COD+"/turma");
      await Sala.apagar("salas/"+COD+"/perguntas");
      await Sala.apagar("salas/"+COD+"/pergunta");
      await Sala.apagar("salas/"+COD+"/revelado");
      for(const id of Object.keys(jogadores))
        await Sala.mesclar("salas/"+COD+"/jogadores/"+id,{pontos:0});
    },"O início da partida");
  }
  /* numero da partida: o celular zera as proprias respostas quando ve um novo */
  const partida=Date.now();
  for(let k=5;k>=1;k--){
    mostraContagem(k);
    if(aoVivo)enfileira(()=>Sala.mesclar("salas/"+COD+"/info",{estado:"contagem",contagem:k,partida,versao:VERSAO}),"A contagem");
    await espera(1000);
  }
  escondeContagem();
  comecou=true; contando=false;
  render(); openQ(1);   /* daqui em diante o jogo segue sozinho, questao por questao */
}

async function encerrar(){
  if(acabou)return;
  acabou=true;
  $("encerrar").hidden=true;
  timers.forEach(clearTimeout); timers=[];
  closeQ(); $("cenaPalco").hidden=true;
  let res={};
  if(aoVivo){ try{ res=(await Sala.ler("salas/"+COD+"/respostas"))||{} }catch(e){} }
  respostasFinais=res;
  /* a contagem de pontos so acontece agora, no fim */
  const pontos={};
  Object.keys(jogadores).forEach(id=>{pontos[id]=0});
  Q.forEach(q=>{
    const r=res[q.n]||{};
    Object.keys(pontos).forEach(id=>{
      const a=r[id];
      if(a&&a.alt===q.ok){
        const frac=1-(a.ms||0)/((q.t||60)*1000);
        pontos[id]+=10+Math.max(0,Math.min(5,Math.round(5*frac)));
      }
    });
  });
  Object.keys(pontos).forEach(id=>{ if(jogadores[id]) jogadores[id].pontos=pontos[id]; });
  /* meta coletiva: soma os acertos da sala inteira; quem nao respondeu conta como erro */
  turma=calculaTurma(res,Object.keys(pontos));
  if(aoVivo){
    await enfileira(async()=>{
      for(const par of Object.entries(pontos))
        await Sala.mesclar("salas/"+COD+"/jogadores/"+par[0],{pontos:par[1]});
      const gab={}; Q.forEach(q=>{gab[q.n]={ok:q.ok,sol:q.sol}});
      await Sala.gravar("salas/"+COD+"/gabarito",gab);
      await Sala.gravar("salas/"+COD+"/turma",
        {pct:turma.pct,meta:turma.meta,ligou:turma.ligou,certos:turma.certos,total:turma.total});
      await Sala.mesclar("salas/"+COD+"/info",{estado:"fim"});
    },"O resultado");
  }
  M.forEach(m=>{st.fixed[m.n]=true});
  st.last=M[4].read;
  render();
  if(turma.ligou){ powerOn(); timers.push(setTimeout(()=>flash("Turma: "+turma.pct+"% de acerto!"),3400)); }
  else desarmaGeral();
  timers.push(setTimeout(mostraRelatorio,turma.ligou?4600:5200));
}

/* Turma abaixo da meta: o geral tenta armar, nao segura, e os circuitos caem de novo */
function desarmaGeral(){
  const sw=$("mainSwitch"), el=$("electrician");
  sw.classList.add("ready"); say("Armando o disjuntor geral...",1600);
  timers.push(setTimeout(()=>{
    sw.classList.remove("ready");
    st.falhou=true; st.fixed={}; st.last="";
    render();
    el.classList.add("zap"); flash("DESARMOU!");
    say("Só "+turma.pct+"% de acerto!",2400);
  },1800));
  timers.push(setTimeout(()=>{ el.classList.remove("zap"); say("A meta era "+META+"%.",2000); },3400));
}

function mostraRelatorio(){
  const ids=Object.keys(jogadores).sort((a,b)=>
    ((jogadores[b].pontos||0)-(jogadores[a].pontos||0)) ||
    String(jogadores[a].nome||"").localeCompare(String(jogadores[b].nome||"")));
  const cabQ=Q.map(q=>'<th>Q'+q.n+"</th>").join("");
  const gabLinha=Q.map(q=>'<td class="gab">'+"ABCD"[q.ok]+"</td>").join("");
  const linhas=ids.map(id=>{
    const cels=Q.map(q=>{
      const a=(respostasFinais[q.n]||{})[id];
      if(!a||a.alt===undefined||a.alt===null) return '<td class="v">—</td>';
      const certo=a.alt===q.ok;
      return '<td class="'+(certo?"c":"e")+'">'+"ABCD"[a.alt]+(certo?" ✓":" ✗")+"</td>";
    }).join("");
    return "<tr><th>"+escapar(jogadores[id].nome||"?")+"</th>"+cels+
      '<td class="pt">'+(jogadores[id].pontos||0)+"</td></tr>";
  }).join("");
  const qlista=Q.map(q=>'<div class="qitem"><b>Questão '+q.n+" · "+escapar(M[q.n-1].name)+"</b> — "+
    escapar(q.text)+'<br>Resposta certa: <b class="g">'+"ABCD"[q.ok]+") "+escapar(q.alts[q.ok][0])+
    "</b><br>"+q.sol+"</div>").join("");
  const t=turma||calculaTurma(respostasFinais,ids);
  const pctLinha=Q.map(q=>'<td class="'+(t.porQ[q.n]>=META?"c":"e")+'">'+t.porQ[q.n]+"%</td>").join("");
  const medidor='<div class="meta '+(t.ligou?"ok":"nao")+'">'+
    '<div class="meta-tit">'+(t.ligou?"💡 A luz voltou!":"🌑 A casa continua no escuro")+
      " — a turma acertou <b>"+t.pct+"%</b> ("+t.certos+" de "+t.total+" respostas) · meta "+META+"%</div>"+
    '<div class="meta-barra"><span style="width:'+Math.min(100,t.pct)+'%"></span>'+
      '<i style="left:'+META+'%" title="meta"></i></div></div>';
  $("relConteudo").innerHTML=
    "<h2>Resultado da turma</h2>"+medidor+
    '<p class="leg">'+ids.length+" participante"+(ids.length===1?"":"s")+
      " · 5 questões · cada acerto vale 10 pontos + até 5 de bônus por rapidez</p>"+
    '<div style="overflow-x:auto"><table><thead><tr><th>Nome</th>'+cabQ+"<th>Pontos</th></tr></thead>"+
    '<tbody><tr class="gabarito"><th>resposta certa</th>'+gabLinha+'<td class="v">—</td></tr>'+
    linhas+'<tr class="pct"><th>acerto da turma</th>'+pctLinha+'<td class="pt">'+t.pct+"%</td></tr>"+
    "</tbody></table></div>"+
    "<h3>As questões</h3>"+qlista+
    '<div class="fechar"><button class="b" id="fecharRel">Fechar relatório</button></div>';
  $("relatorio").hidden=false;
  $("fecharRel").onclick=fecharRelatorio;
}
function fecharRelatorio(){ const r=$("relatorio"); if(r) r.hidden=true; }

/* ---------- sala ao vivo ---------- */
function aviso(txt,ruim){const b=$("banner");b.hidden=false;b.className="banner"+(ruim?" ruim":"");b.textContent=txt}
function erroRede(e){
  const b=$("banner");
  if(!e){ if(b.dataset.rede==="1"){b.hidden=true;b.dataset.rede=""} return }
  b.dataset.rede="1";b.hidden=false;b.className="banner ruim";
  b.textContent="Sem conexão com o servidor — os celulares não estão recebendo nada. Tentando de novo…";
}
async function abrirSala(){
  if(!Sala.ligado()){
    $("painelSala").hidden=true;
    aviso("Modo local: placar ao vivo desligado (falta preencher o config.js). Para apresentar com equipes no papel, abra classico.html.",false);
    salaPronta=true; render();
    return;
  }
  try{
    await Sala.gravar("salas/"+COD+"/info",{estado:"lobby",circuito:0,criada:Date.now(),versao:VERSAO});
    await Sala.gravar("salaAtiva",{codigo:COD,criada:Date.now()});
    aoVivo=true; salaPronta=true;
    $("codigo").textContent=COD;
    render();
    obsSala=Sala.observar("salas/"+COD,d=>{
      jogadores=(d&&d.jogadores)||{};
      respostas=(d&&d.respostas)||{};
      desenhaPlacar();atualizaContagem();atualizaBotaoInicio();
    },erroRede,1500);
  }catch(e){
    $("painelSala").hidden=true;
    aviso("Não consegui abrir a sala ("+e.message+"). O jogo continua, mas sem celulares.",true);
    salaPronta=true; render();
  }
}
/* Durante a partida a barra mostra QUEM JA RESPONDEU a questao da vez, nunca acerto nem pontuacao:
   o resultado so aparece no fim, no relatorio. */
function desenhaPlacar(){
  const js=Object.entries(jogadores).map(([id,j])=>
    ({id:id,nome:j.nome||"?",p:j.pontos||0,q:j.q||1,fim:!!j.terminou}));
  if(aoVivo)$("nJog").textContent=js.length===1?"1 jogador":js.length+" jogadores";
  if(!js.length){ $("teams").innerHTML='<div class="team">esperando jogadores<b>0</b></div>'; return; }
  if(acabou){
    js.sort((a,b)=>b.p-a.p||a.nome.localeCompare(b.nome));
    $("teams").innerHTML=js.map((j,i)=>'<div class="team'+(i===0?" lider":"")+'">'+escapar(j.nome)+"<b>"+j.p+"</b></div>").join("");
  } else if(comecou&&aoVivo){
    js.sort((a,b)=>a.nome.localeCompare(b.nome));
    const rq=(cur&&!jaRevelou&&respostas[cur.n])||null;
    $("teams").innerHTML=js.map(j=>{const ja=!!(rq&&rq[j.id]);
      return '<div class="team'+(ja?" lider":"")+'">'+escapar(j.nome)+"<b>"+(rq?(ja?"✓":"…"):"•")+"</b></div>"}).join("");
  } else {
    js.sort((a,b)=>a.nome.localeCompare(b.nome));
    $("teams").innerHTML=js.map(j=>'<div class="team">'+escapar(j.nome)+"<b>•</b></div>").join("");
  }
}
function publicaPergunta(q,m){
  if(!aoVivo)return Promise.resolve();
  return enfileira(async()=>{
    await Sala.apagar("salas/"+COD+"/revelado");
    await Sala.gravar("salas/"+COD+"/pergunta",
      {n:q.n,circ:m.name,enunciado:q.text,alts:q.alts.map(a=>a[0]),t:q.t,fig:q.fig||null});
    await Sala.mesclar("salas/"+COD+"/info",{estado:"pergunta",circuito:q.n});
  },"A questão");
}
function atualizaContagem(){
  const el=$("contagem");
  if(!aoVivo||!cur||$("stage").hidden||jaRevelou){el.hidden=true;return}
  const res=respostas[cur.n]||{}, r=Object.keys(res).length, t=Object.keys(jogadores).length;
  el.hidden=false;
  el.classList.toggle("cheio",t>0&&r>=t);
  if(t>0&&r>=t){
    el.textContent="todos responderam!";
    /* ninguem fica olhando o cronometro a toa: revela sozinho */
    if(!revelarAgendado){
      revelarAgendado=true;
      timers.push(setTimeout(()=>{ if(!jaRevelou&&!$("stage").hidden) reveal(); },1200));
    }
  } else {
    el.textContent=r+" de "+t+" responderam";
  }
}
$("iniciar").onclick=iniciarPartida;
$("encerrar").onclick=()=>{ if(confirm("Encerrar agora e mostrar o resultado?")) encerrar(); };
$("verRel").onclick=()=>{ if(acabou) mostraRelatorio(); };
st=fresh(); render(); abrirSala();
</script>
