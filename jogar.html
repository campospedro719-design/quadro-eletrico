<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22283a">
<title>Quadro Elétrico — jogar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Tela do celular. Mobile-first de verdade: um conteúdo por vez, alvos
   de toque de 56px+, nada de rolagem horizontal, texto grande o bastante
   para ler de relance numa sala agitada. */
:root{
  --sky:#8fd3e6; --ink:#22283a; --paper:#fffaf0;
  --red:#f0595b; --green:#3fbf7f; --yellow:#ffd23f; --blue:#4a7bd8; --cinza:#5f6f86;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);
  font-size:17px;font-weight:700;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.1}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 6px 0 var(--ink)}
.eu{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-size:1.05rem}
.eu .passo{background:var(--ink);color:var(--yellow);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
label.campo{display:block;font-size:.95rem;margin-bottom:6px}
input[type=text]{
  width:100%;font:800 1.25rem var(--body);padding:14px;border:3px solid var(--ink);
  border-radius:14px;background:#fff;color:var(--ink);min-height:56px;
}
input[type=text]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button{
  appearance:none;font:800 1.05rem var(--body);border:3px solid var(--ink);border-radius:999px;
  padding:16px 20px;min-height:58px;width:100%;background:var(--yellow);color:var(--ink);
  cursor:pointer;touch-action:manipulation;
}
button:disabled{opacity:.5}
button.go{background:var(--green);color:#fff}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
/* alternativas */
.alts{display:flex;flex-direction:column;gap:10px}
.alt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px;
  font:700 1.02rem var(--body);line-height:1.35;min-height:60px;cursor:pointer;
}
.alt .k{
  font-family:var(--display);font-size:1.2rem;flex:none;
  width:2em;height:2em;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
/* a escolhida fica marcada, mas sem dizer se está certa: isso só no fim */
.alt[aria-pressed=true]{background:var(--yellow);box-shadow:0 0 0 4px var(--ink) inset}
.alt.apagada{opacity:.4}
.alt{position:relative;overflow:hidden}
.alt>*{position:relative}
.alt .txt{flex:1}
.alt .barra{position:absolute;left:0;top:0;bottom:0;background:#cfd8e6;animation:cresce 1s cubic-bezier(.2,.8,.3,1)}
@keyframes cresce{from{width:0}}
.alt .pct{flex:none;align-self:center;font-family:var(--display);font-size:1.3rem}
.alt.correct{background:#2fb36b;border-color:#0f6b3a;color:#fff}
.alt.correct .barra{background:#17834a}
.alt.correct .k{background:#fff;color:#17834a}
.alt.minha{box-shadow:0 0 0 4px var(--yellow) inset}
.alt .voce{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.alt:disabled{cursor:default}
/* cabeçalho da questão */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tag{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza)}
.timer{
  font-family:var(--display);font-size:1.8rem;background:var(--ink);color:var(--yellow);
  border-radius:999px;min-width:3.2ch;text-align:center;padding:2px 14px;font-variant-numeric:tabular-nums
}
.timer.baixo{background:var(--red);color:#fff}
.qtexto{font-size:1.1rem;line-height:1.45;margin:0 0 14px}
/* figura da questão (ex.: o gráfico V × i) */
svg.graf{display:block;margin:0 auto 14px;max-width:100%;height:auto;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px}
svg.graf text{font-family:var(--body);font-size:11px;fill:var(--ink);font-weight:700}
/* avisos e estados */
.aviso{font-family:var(--display);font-size:1.3rem;text-align:center;margin:0}
.sub{font-size:.95rem;font-weight:700;text-align:center;margin:8px 0 0;color:var(--cinza)}
.grande{font-family:var(--display);font-size:2.4rem;text-align:center;margin:0}
.contagem{font-family:var(--display);font-size:5.5rem;line-height:1;text-align:center;margin:10px 0;color:var(--ink)}
.contagem.bate{animation:bate .9s ease-out}
@keyframes bate{0%{transform:scale(.5);opacity:0}28%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
.pulso{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--green);margin-right:6px}
.caiu .pulso{background:var(--red)}
.rede{font-size:.82rem;font-weight:700;color:var(--cinza);text-align:center;margin:0}
.erro{background:#ffe3e3;border:3px solid var(--red);border-radius:14px;padding:12px;font-size:.9rem;line-height:1.4}
.espacador{height:12px}
/* resultado final */
.linha{display:flex;justify-content:space-between;gap:10px;border-bottom:2px dashed #d8d2c4;padding:8px 0;font-size:1rem}
.linha:last-child{border-bottom:0}
.linha .c{color:var(--green)} .linha .e{color:var(--red)} .linha .v{color:var(--cinza)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <h1>Quadro Elétrico</h1>

  <div class="card eu" id="caixaEu" hidden>
    <span id="meuNome"></span>
    <span class="passo" id="meuPasso" hidden></span>
  </div>

  <div id="tela"></div>

  <p class="rede" id="rede"></p>
</div>

<script src="config.js"></script>
<script src="sala.js"></script>
<script src="figuras.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const tela = $("#tela");
const euId = Sala.idJogador();
const TOTAL = 5;

let sala = null;        // código da sala
let entrei = false;     // só desenha o jogo depois de registrar o nome
let eu = { nome: "" };
let dados = null;       // conteúdo da sala vindo do banco
let obs = null;
let etapa = "";         // o que está desenhado agora
let respondi = {};      // { nQuestao: alternativa }
let vistaEm = {};       // { nQuestao: quando esta questão apareceu aqui }
let minhaPartida = 0;   // partida a que respondi/vistaEm se referem
let relogio = null;

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- memória local (sobrevive a recarregar a página) ---------- */
const chave = () => `quadro:sala:${sala}`;
function salvar() {
  try { localStorage.setItem(chave(), JSON.stringify({ nome: eu.nome, respondi, vistaEm, partida: minhaPartida })); } catch (e) {}
}
function carregar() {
  try {
    const v = JSON.parse(localStorage.getItem(chave()) || "null");
    if (v) {
      eu.nome = v.nome || "";
      respondi = v.respondi || {};
      vistaEm = v.vistaEm || {};
      minhaPartida = v.partida || 0;
    }
  } catch (e) {}
}

/* ---------- entrada ---------- */
async function descobrirSala() {
  const naUrl = new URLSearchParams(location.search).get("sala");
  if (naUrl) return naUrl.toUpperCase().trim();
  const ativa = await Sala.ler("salaAtiva");
  if (ativa && ativa.codigo && (Date.now() - (ativa.criada || 0)) / 3.6e6 < 6) {
    return String(ativa.codigo).toUpperCase();
  }
  return null;
}

async function iniciar() {
  if (!Sala.ligado()) {
    return desenhaErro("Este link ainda não foi configurado.",
      "Falta ligar o banco de dados em <code>config.js</code>. Sem isso o jogo não funciona — avise quem montou.");
  }
  tela.innerHTML = `<div class="card"><p class="aviso">Procurando a sala…</p></div>`;
  let cod;
  try { cod = await descobrirSala(); }
  catch (e) { return desenhaErro("Não consegui falar com o servidor.", esc(e.message)); }
  if (!cod) return pedirCodigo();
  sala = cod;
  carregar();
  if (eu.nome) await entrar(eu.nome); else pedirNome();
  observar();
}

function pedirCodigo() {
  tela.innerHTML = `<div class="card">
    <label class="campo" for="cod">Nenhuma sala aberta agora. Digite o código que está na tela da sala:</label>
    <input type="text" id="cod" maxlength="4" autocapitalize="characters" autocomplete="off"
           placeholder="ex.: BKPT" style="text-align:center;letter-spacing:.3em;font-size:1.8rem">
    <div class="espacador"></div>
    <button class="go" id="irCod">Continuar</button>
  </div>`;
  const inp = $("#cod");
  inp.oninput = () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g, ""); };
  $("#irCod").onclick = async () => {
    if (inp.value.trim().length < 4) return;
    sala = inp.value.trim();
    const info = await Sala.ler(`salas/${sala}/info`).catch(() => null);
    if (!info) return desenhaErro("Não achei essa sala.", "Confira o código na tela da sala.", pedirCodigo);
    carregar();
    if (eu.nome) await entrar(eu.nome); else pedirNome();
    observar();
  };
}

function pedirNome() {
  tela.innerHTML = `<div class="card">
    <label class="campo" for="nome">Seu nome (é o que vai aparecer no relatório da sala):</label>
    <input type="text" id="nome" maxlength="18" autocomplete="off" placeholder="ex.: Pedro">
    <div class="espacador"></div>
    <button class="go" id="entrar" disabled>Entrar no jogo</button>
    <p class="sub">Sala <b>${esc(sala)}</b></p>
  </div>`;
  const inp = $("#nome"), bt = $("#entrar");
  inp.oninput = () => { bt.disabled = inp.value.trim().length < 2; };
  inp.onkeydown = (e) => { if (e.key === "Enter" && !bt.disabled) bt.click(); };
  bt.onclick = async () => {
    bt.disabled = true; bt.textContent = "Entrando…";
    try { await entrar(inp.value.trim()); }
    catch (e) {
      bt.disabled = false; bt.textContent = "Entrar no jogo";
      desenhaErro("Não consegui entrar.", esc(e.message), pedirNome);
    }
  };
  setTimeout(() => inp.focus(), 50);
}

async function entrar(nome) {
  eu.nome = nome;
  salvar();
  await Sala.mesclar(`salas/${sala}/jogadores/${euId}`, { nome, entrouEm: Date.now() });
  entrei = true;
  $("#caixaEu").hidden = false;
  $("#meuNome").textContent = nome;
  etapa = "";
  if (dados) desenha();
}

/* ---------- acompanhar a sala ---------- */
function observar() {
  if (obs) obs.parar();
  obs = Sala.observar(`salas/${sala}`, (d) => { dados = d; desenha(); }, mostraRede, 1500);
}
function mostraRede(err) {
  const el = $("#rede");
  if (err) { el.className = "rede caiu"; el.innerHTML = `<span class="pulso"></span>sem conexão — tentando de novo…`; }
  else { el.className = "rede"; el.innerHTML = `<span class="pulso"></span>conectado · sala ${esc(sala)}`; }
}
function desenhaErro(titulo, detalhe, voltar) {
  tela.innerHTML = `<div class="card"><p class="aviso">${esc(titulo)}</p>
    <div class="espacador"></div><div class="erro">${detalhe}</div>
    ${voltar ? `<div class="espacador"></div><button id="volta">Tentar de novo</button>` : ""}</div>`;
  if (voltar) $("#volta").onclick = voltar;
}

/* ---------- o que desenhar ---------- */
function desenha() {
  if (!entrei) return;                       // a tela é do jogador até ele entrar
  if (!dados || !dados.info) {
    tela.innerHTML = `<div class="card"><p class="aviso">Aguardando a sala abrir…</p></div>`;
    return;
  }
  const st = dados.info.estado || "lobby";
  /* Reiniciar na sala comeca uma partida nova: o que este celular respondeu
     na anterior nao vale mais */
  const partida = dados.info.partida || 0;
  if (partida && partida !== minhaPartida) {
    minhaPartida = partida; respondi = {}; vistaEm = {};
    salvar();
  }
  /* A sala manda uma questão por vez e todo mundo responde a mesma.
     Só redesenha quando muda algo que importa para esta tela. */
  const q = dados.pergunta || null, n = q ? q.n : 0;
  const rev = dados.revelado || null;
  const marca = [st, dados.info.contagem || 0, n, respondi[n] === undefined ? 0 : 1,
                 rev ? rev.n : 0, dados.info.circuito || 0].join(":");
  if (marca === etapa) return atualizaQuantos();   // nada mudou: não redesenha sob o dedo
  etapa = marca;

  if (obs) obs.ritmo(st === "contagem" ? 450 : 1000);

  const passo = $("#meuPasso");
  passo.hidden = !(n && (st === "pergunta" || st === "revelando"));
  if (!passo.hidden) passo.textContent = `questão ${n} de ${TOTAL}`;

  pararRelogio();
  if (st === "contagem") return desenhaContagem(dados.info.contagem);
  if (st === "pergunta" && q) return desenhaQuestao(q);
  if (st === "revelando" && q && rev && rev.n === n) return desenhaRevelado(q, rev);
  if (st === "circuito") return desenhaCircuito(dados.info);
  if (st === "fim") return desenhaResultado();
  return desenhaEspera();
}

function desenhaEspera() {
  const n = Object.keys(dados.jogadores || {}).length;
  tela.innerHTML = `<div class="card">
    <p class="aviso">Você está dentro! 🔌</p>
    <p class="sub">Olhe para a tela da sala. O jogo começa quando quem apresenta clicar em Iniciar partida.</p>
    <p class="sub">${n} jogador${n === 1 ? "" : "es"} na sala</p>
  </div>`;
}

function desenhaContagem(n) {
  tela.innerHTML = `<div class="card" style="text-align:center">
    <p class="aviso">Prepare-se!</p>
    <p class="contagem bate">${n ? esc(n) : "…"}</p>
    <p class="sub">A primeira questão vem aí</p>
  </div>`;
}

function desenhaQuestao(q) {
  const n = q.n;
  if (!vistaEm[n]) { vistaEm[n] = Date.now(); salvar(); }
  const escolhi = respondi[n];
  const jaRespondeu = escolhi !== undefined;
  const alts = (q.alts || []).map((t, i) => `
    <button class="alt ${jaRespondeu && escolhi !== i ? "apagada" : ""}" data-i="${i}"
            aria-pressed="${escolhi === i ? "true" : "false"}" ${jaRespondeu ? "disabled" : ""}>
      <span class="k">${"ABCD"[i]}</span><span class="txt">${esc(t)}</span>
    </button>`).join("");

  tela.innerHTML = `<div class="card">
    <div class="qtop">
      <div class="tag">Circuito ${esc(q.circ || "")} · questão ${esc(n)} de ${TOTAL}</div>
      <div class="timer" id="t">${esc(q.t || 60)}</div>
    </div>
    <p class="qtexto">${esc(q.enunciado)}</p>
    ${q.fig && window.FIGURAS && FIGURAS[q.fig] ? FIGURAS[q.fig] : ""}
    <div class="alts" id="alts">${alts}</div>
    <p class="sub" id="status">${jaRespondeu ? "Resposta registrada. Aguardando a turma…" : "Toque na alternativa que você acha certa."}</p>
    <p class="sub" id="quantos"></p>
  </div>`;

  document.querySelectorAll(".alt").forEach((b) => { b.onclick = () => responder(q, +b.dataset.i); });
  atualizaQuantos();
  iniciaRelogio(q);
}

/* "7 de 12 responderam": atualiza no lugar, sem redesenhar a questão */
function atualizaQuantos() {
  const el = $("#quantos"), q = dados && dados.pergunta;
  if (!el || !q) return;
  const total = Object.keys(dados.jogadores || {}).length;
  const r = Object.keys(((dados.respostas || {})[q.n]) || {}).length;
  el.textContent = `${r} de ${total} responderam`;
}

/* Não existe "pular": depois de responder, espera o tempo acabar ou a
   turma toda responder. Quem decide a hora de revelar é a tela da sala. */
async function responder(q, i) {
  const n = q.n;
  if (respondi[n] !== undefined || tempoAcabou(n)) return;
  respondi[n] = i;
  salvar();
  document.querySelectorAll(".alt").forEach((b) => {
    b.disabled = true;
    b.setAttribute("aria-pressed", +b.dataset.i === i ? "true" : "false");
    if (+b.dataset.i !== i) b.classList.add("apagada");
  });
  $("#status").textContent = "Enviando…";
  const ms = Date.now() - (vistaEm[n] || Date.now());
  try {
    await Sala.gravar(`salas/${sala}/respostas/${n}/${euId}`, { alt: i, ms });
    $("#status").textContent = "Resposta registrada. Aguardando a turma…";
  } catch (e) {
    $("#status").textContent = "Não saiu. Toque de novo.";
    delete respondi[n]; salvar();
    document.querySelectorAll(".alt").forEach((b) => { b.disabled = false; b.classList.remove("apagada"); });
  }
}

const tempoAcabou = (n) => {
  const q = dados && dados.pergunta;
  return !!(q && q.n === n && vistaEm[n] && Date.now() - vistaEm[n] >= (q.t || 60) * 1000);
};

/* O cronômetro conta a partir de quando ESTE celular viu a questão, não do
   relógio do aparelho — se a hora estiver errada, tanto faz. */
function iniciaRelogio(q) {
  const total = q.t || 60, n = q.n, el = $("#t");
  const passo = () => {
    const resta = Math.max(0, total - Math.round((Date.now() - vistaEm[n]) / 1000));
    if (el) { el.textContent = resta; el.classList.toggle("baixo", resta <= 10); }
    if (resta <= 0) {
      pararRelogio();
      if (respondi[n] === undefined) {
        document.querySelectorAll(".alt").forEach((b) => { b.disabled = true; b.classList.add("apagada"); });
        const s = $("#status"); if (s) s.textContent = "Tempo esgotado. Aguarde o resultado na tela da sala.";
      }
    }
  };
  passo();
  relogio = setInterval(passo, 250);
}
function pararRelogio() { if (relogio) { clearInterval(relogio); relogio = null; } }

/* Resultado da questão: % de cada opção e a certa em verde forte */
function desenhaRevelado(q, rev) {
  const minha = respondi[q.n];
  const pct = rev.pct || [];
  const alts = (q.alts || []).map((t, i) => `
    <div class="alt ${i === rev.ok ? "correct" : ""} ${minha === i ? "minha" : ""}">
      <span class="barra" style="width:${Math.max(0, Math.min(100, +pct[i] || 0))}%"></span>
      <span class="k">${"ABCD"[i]}</span><span class="txt">${esc(t)}${minha === i ? '<small class="voce">sua resposta</small>' : ""}</span>
      <span class="pct">${esc(+pct[i] || 0)}%</span>
    </div>`).join("");
  tela.innerHTML = `<div class="card">
    <div class="qtop"><div class="tag">Circuito ${esc(q.circ || "")} · resultado da questão ${esc(q.n)}</div></div>
    <div class="alts">${alts}</div>
    <p class="sub">${minha === undefined ? "Você não respondeu esta." : ""} Olhe a resolução na tela da sala.</p>
  </div>`;
}

function desenhaCircuito(info) {
  const ok = !!info.circOk, pct = info.circPct;
  tela.innerHTML = `<div class="card" style="text-align:center">
    <p class="grande">${ok ? "🔧" : "⚡"}</p>
    <p class="aviso">Circuito ${esc(info.circuito)}: ${ok ? "consertado!" : "deu choque!"}</p>
    <p class="sub">${pct === null || pct === undefined ? "" : `A turma acertou ${esc(pct)}%. `}Olhe para a tela da sala 👀</p>
  </div>`;
}

function desenhaResultado() {
  const gab = dados.gabarito || {};
  const js = Object.entries(dados.jogadores || {})
    .map(([id, j]) => ({ id, nome: j.nome || "?", p: j.pontos || 0 }))
    .sort((a, b) => b.p - a.p);
  const meu = js.findIndex((j) => j.id === euId) + 1;
  const meusPontos = (js.find((j) => j.id === euId) || {}).p || 0;

  let certas = 0;
  const linhas = [];
  for (let n = 1; n <= TOTAL; n++) {
    const g = gab[n], minha = respondi[n];
    const certo = g && minha === g.ok;
    if (certo) certas++;
    linhas.push(`<div class="linha">
      <span>Questão ${n}</span>
      <span>${minha === undefined ? '<b class="v">não respondeu</b>'
        : `você: <b class="${certo ? "c" : "e"}">${"ABCD"[minha]}</b>${g ? ` · certa: <b class="c">${"ABCD"[g.ok]}</b>` : ""}`}</span>
    </div>`);
  }

  const t = dados.turma;
  const turma = t ? `<p class="aviso">${t.ligou ? "💡 A luz voltou!" : "🌑 A casa ficou no escuro"}</p>
    <p class="sub">A turma acertou ${esc(t.pct)}% · meta ${esc(t.meta)}%</p>
    <div class="espacador"></div>` : "";

  tela.innerHTML = `<div class="card">
    ${turma}
    <p class="grande">${meu === 1 ? "🏆" : "💡"}</p>
    <p class="aviso">${certas} de ${TOTAL} certas · ${meusPontos} pontos</p>
    <p class="sub">${meu ? `${meu}º lugar entre ${js.length}` : ""}</p>
    <div class="espacador"></div>
    ${linhas.join("")}
    <p class="sub">O relatório completo da turma está na tela da sala.</p>
  </div>`;
}

iniciar();
</script>

</body>
</html>
